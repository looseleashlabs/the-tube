# Publishes the guide to GitHub Pages. config.json (the TV sign-in client) is written from repository secrets at
# deploy time, so it is served by the site but never stored in the repo or its history.
name: Publish The Tube

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          TV_CLIENT_ID: ${{ secrets.TV_CLIENT_ID }}
          TV_CLIENT_SECRET: ${{ secrets.TV_CLIENT_SECRET }}
        run: |
          mkdir -p _site
          cp index.html _site/
          jq -n --arg id "$TV_CLIENT_ID" --arg secret "$TV_CLIENT_SECRET" \
            '{tvClientId: $id, tvClientSecret: $secret}' > _site/config.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
