<h1 style="color:#f5d000;margin-top:0">One setting for The Tube</h1>
<p>In the Firefox panel that's open on the left, turn <b>off</b> the switch for<br><b>Enhanced Tracking Protection</b> on this site.</p>
<p style="color:#9fd">That lets the guide's players see your YouTube Premium. Other sites stay protected.</p>
