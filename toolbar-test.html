<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1">
<title>back test</title>
<body style="margin:0;background:#10206f;color:#f5d000;font:32px sans-serif">
<div style="position:fixed;inset:0;display:grid;place-items:center;border:8px solid #f5d000"><pre id="log" style="font:28px monospace"></pre></div>
<script>
const log=t=>{log.lines=(log.lines||[]).concat(new Date().toLocaleTimeString()+' '+t).slice(-12);document.getElementById('log').textContent=log.lines.join('\n')};
for(const ev of ['keydown','keyup'])addEventListener(ev,e=>log(ev+' key='+e.key+' code='+e.code+' kc='+e.keyCode),true);
addEventListener('popstate',()=>{log('popstate');history.pushState({},'')});
addEventListener('fullscreenchange',()=>log('fullscreen '+!!document.fullscreenElement));
addEventListener('keydown',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(e=>log('fs err '+e.message));history.pushState({},'')},{once:true});
history.pushState({},'');log('ready');
</script>
